name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its older run; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # @vscode/ripgrep downloads its binary from GitHub on install; the token
      # keeps it clear of the anonymous rate limit.
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The single questions on a few TypeScript, JavaScript, Go and Dart corpora,
  # held to eval/gate.json: a pull request that answers worse fails here. One
  # system is enough; the answers do not depend on it. Go, gopls and Flutter
  # are the versions the baseline was written with.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - run: go install golang.org/x/tools/gopls@v0.24.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true
      - run: npm run corpora -- --only zustand,parse-server,chi,provider
      # Dart's server follows imports only once the packages are fetched.
      - run: for p in eval/corpora/provider/packages/*/; do (cd "$p" && flutter pub get); done
      - run: npm run eval -- --adapter csyk --corpus mini-ts,zustand,parse-server,chi,provider --limit 30
      - run: npm run gate
