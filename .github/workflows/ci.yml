name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its older run; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # @vscode/ripgrep downloads its binary from GitHub on install; the token
      # keeps it clear of the anonymous rate limit.
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The single questions on a few TypeScript and JavaScript corpora, held to
  # eval/gate.json: a pull request that answers worse fails here. One
  # system is enough; the answers do not depend on it.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run corpora -- --only zustand,parse-server
      - run: npm run eval -- --adapter csyk --corpus mini-ts,zustand,parse-server --limit 30
      - run: npm run gate
