name: Release

# Run by hand only (see CONTRIBUTING.md): on a version tag, it builds the standalone packages
# and makes the GitHub release, gh workflow run Release --ref v<version>; on a branch, it only
# builds and tries the packages. Nothing runs on pushes, tags or pull requests.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  standalone:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-latest, os: darwin, arch: arm64 }
          # Built on an Apple silicon Mac, so it cannot be tried there.
          - { runner: macos-latest, os: darwin, arch: x64, cross: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: scripts/package.sh ${{ matrix.os }} ${{ matrix.arch }}
      # Without Node.js on the PATH, as on a machine that never installed it.
      - if: ${{ !matrix.cross }}
        run: |
          node=$(command -v node)
          PATH=/usr/bin:/bin "$node" scripts/smoke.ts packages/csyk-${{ matrix.os }}-${{ matrix.arch }}/bin/csyk
      - uses: actions/upload-artifact@v4
        with:
          name: csyk-${{ matrix.os }}-${{ matrix.arch }}
          path: packages/csyk-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

  # npm is published from here only when the repository has an NPM_TOKEN secret; without one,
  # the owner publishes by hand (npm publish) and this job makes the GitHub release alone.
  publish:
    needs: standalone
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm test
      # prepack builds dist/ first.
      - if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag packages/*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
