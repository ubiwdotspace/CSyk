# Corpora the cases run against: <name>: { path, commit?, git? }.
# With git and commit, `npm run corpora` fetches that commit into path.
# Private corpora go in corpora.local.yaml, which is git-ignored, with their
# cases under cases/private/.
mini-ts:
  path: eval/fixtures/mini-ts

# Each language has five public corpora: two well-known libraries and three real projects
# (apps and servers people run), so a score is not only about library code.

